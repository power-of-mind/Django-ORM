<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Catalog{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .phone {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        img {
            width: 120px;
            border-radius: 8px;
        }

        .price {
            font-weight: bold;
            color: green;
        }

        .sort {
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            margin-right: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>

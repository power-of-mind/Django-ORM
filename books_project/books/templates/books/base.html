<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
        }

        h1 {
            text-align: center;
            color: #2f80ed;
            margin-top: 40px;
        }

        /* контейнер каталога */
        .container {
            max-width: 900px;
            margin: 60px auto;
        }

        /* сетка книг */
        .books {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 60px 80px;
        }

        .book h3 {
            margin: 0 0 10px 0;
        }

        a {
            color: #2f80ed;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        p {
            margin: 5px 0;
            color: #555;
        }
    </style>
</head>
<body>

<h1>Каталог</h1>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
